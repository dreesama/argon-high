name: Argon High CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Tests & Media Engine Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (FFmpeg & FFprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Version
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Regression & Security Test Suite
        env:
          ENVIRONMENT: "development"
          SECRET_KEY: "ci-test-secret-key-remediation-v1"
          ARGON_API_KEY: "argon_dev_token_syndicate_2026"
          DEFAULT_WORKSPACE_ID: "ws-argon-core"
        run: |
          python -m pytest backend/tests -v --durations=10

  frontend-verification:
    name: Frontend Build & Type Inspection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Compilation & Production Build
        run: npm run build

  security-checks:
    name: Static Security & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis on Backend
        run: |
          bandit -r backend/app -ll -ii || true

      - name: Ensure No Hard-coded Secrets in Versioned Configs
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          
          patterns = [
              r'AIza[0-9A-Za-z-_]{35}',
              r'sk-[a-zA-Z0-9]{32,}',
              r'postgres://.*:.*@',
          ]
          found = False
          for p in Path('.').glob('**/*.py'):
              if 'venv' in str(p) or '.pytest_cache' in str(p): continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              for pat in patterns:
                  if re.search(pat, text):
                      print(f'Potential secret pattern {pat} found in {p}')
                      found = True
          if found:
              sys.exit(1)
          print('Clean: No raw production secret credentials found.')
          "
