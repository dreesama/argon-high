name: Argon High CI & Security Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Tests & Media Engine Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS Objects are Downloaded
        run: |
          git lfs pull

      - name: Install System Dependencies (FFmpeg & FFprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Version & Validate Speech Audio Fixture with FFprobe
        run: |
          ffmpeg -version
          ffprobe -version
          ls -lh backend/tests/fixtures/spoken_sample.wav
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,duration -of default=noprint_wrappers=1 backend/tests/fixtures/spoken_sample.wav

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Regression & Security Test Suite
        env:
          ENVIRONMENT: "development"
          SECRET_KEY: "ci-test-secret-key-remediation-v1"
          ARGON_API_KEY: "argon_dev_token_syndicate_2026"
          DEFAULT_WORKSPACE_ID: "ws-argon-core"
        run: |
          python -m pytest backend/tests -v --durations=10

  frontend-verification:
    name: Frontend Build & Type Inspection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Compilation & Production Build
        run: npm run build

  security-checks:
    name: Static Security & Credential Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Analysis on Backend
        run: |
          bandit -r backend/app -ll -ii

      - name: Comprehensive Secret & Credential Scanning (Frontend and Backend)
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          
          secret_patterns = [
              (r'AIza[0-9A-Za-z-_]{35}', 'Google API Key'),
              (r'sk-[a-zA-Z0-9]{32,}', 'OpenAI API Key'),
              (r'postgres://[^:]+:[^@]+@', 'PostgreSQL Connection URI with Password'),
              (r'ghp_[0-9a-zA-Z]{36}', 'GitHub Personal Access Token'),
              (r'xox[baprs]-[0-9a-zA-Z]{10,48}', 'Slack Token'),
          ]
          
          scan_paths = list(Path('src').glob('**/*')) + list(Path('backend/app').glob('**/*')) + list(Path('backend/migrations').glob('**/*'))
          found = False
          for p in scan_paths:
              if p.is_dir() or 'node_modules' in str(p) or '__pycache__' in str(p):
                  continue
              if p.suffix in ['.ts', '.tsx', '.js', '.jsx', '.json', '.py', '.sql']:
                  try:
                      content = p.read_text(encoding='utf-8', errors='ignore')
                      for pat, name in secret_patterns:
                          if re.search(pat, content):
                              print(f'FAILED: Found potential {name} ({pat}) in {p}')
                              found = True
                  except Exception as e:
                      pass
          
          if found:
              sys.exit(1)
          print('Clean: No raw production secret credentials found in frontend or backend.')
          "
